<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escola</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f3f4f6;
        }

        header {
            background-color: #1f2937;
            color: white;
            padding: 20px;
        }

        header h2 {
            margin: 0 0 10px 0;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .right-menu {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .course-card {
            background: white;
            border: 1px solid #d1d5db;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 10px;
        }

        .course-card img {
            max-height: 200px;
            margin: 20px 0;
        }

        .logout-button {
            background: transparent;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .logout-button:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <header>

        <h2>Escola</h2>

        <nav>

            <a href="{% url 'cursos' %}">
                Cursos
            </a>

            <a href="{% url 'professores' %}">
                Professores
            </a>

            <a href="{% url 'alunos' %}">
                Alunos
            </a>

            <a href="/portfolio/">
                Portfolio
            </a>

            <div class="right-menu">

                {% if user.is_authenticated %}

                    <span>
                        Olá, {{ user.username }}
                    </span>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}

                        <button type="submit" class="logout-button">
                            Logout
                        </button>
                    </form>

                {% else %}

                    <a href="{% url 'login' %}">
                        Login
                    </a>

                {% endif %}

            </div>

        </nav>

    </header>

    <div class="container">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
