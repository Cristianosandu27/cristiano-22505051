<!DOCTYPE html>
<html>
<head>
    <title>Escola</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e9edf3;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 28px;
        }

        .navbar h1 {
            margin: 0 0 12px 0;
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-weight: bold;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .conteudo {
            max-width: 900px;
            margin: 40px auto;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>Escola</h1>

        <a href="{% url 'cursos' %}">Cursos</a>
        <a href="{% url 'professores' %}">Professores</a>
        <a href="{% url 'alunos' %}">Alunos</a>
    </div>

    <div class="conteudo">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
