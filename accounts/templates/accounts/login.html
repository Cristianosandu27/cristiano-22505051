<h1>Login</h1>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Username">
    <br><br>

    <input type="password" name="password" placeholder="Password">
    <br><br>

    <button type="submit">Entrar</button>
</form>

<p style="color:red;">
    {{ erro }}
</p>

<a href="/accounts/registo/">Criar conta</a>
